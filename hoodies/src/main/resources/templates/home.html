<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout}">

<head>
    <title>Home</title>
</head>

<body>
    <div layout:fragment="content">
        <!-- Welcome Section -->
        <div class="jumbotron text-center">
            <h1 class="display-4">Welcome to the Hoodies Store!</h1>
            <img src="https://gogirgit.com/cdn/shop/collections/printed-cotton-unisex-men-hoodies-banner-collection-page-gogirgit.jpg?v=1667813456" class="img-fluid mt-4 w-full" alt="Hoodies">
            <p class="lead">Find the best hoodies for all seasons.</p>
            <hr class="my-4">
            <p>Check out our latest collection.</p>
            <a class="btn btn-primary btn-lg" th:href="@{/products}" role="button">Shop Now</a>
        </div>

        <!-- Featured Products Section -->
        <div class="mt-5">
            <h2 class="mb-4">Featured Products</h2>
            <div class="row row-cols-1 row-cols-md-3 g-4">
                <div class="col" th:each="product : ${products}">
                    <div class="card h-100">
                        <img th:src="${product.imageUrl}" class="card-img-top" alt="Product Image">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                            <p class="card-text" th:text="${product.description}">Product Description</p>
                            <p class="card-text mt-auto"><strong th:text="${product.price} + ' $'">Price</strong></p>
                        </div>
                        <div class="card-footer">
                            <div class="d-flex justify-content-between align-items-center">
                                <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-primary me-2">View
                                    Details</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- "View More" Button -->
            <div class="text-center mt-4">
                <a class="btn btn-secondary" th:href="@{/products}">View More Products</a>
            </div>
        </div>

    </div>
</body>

</html>
